<title>Degrees Playtest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Layout: one screen, no scrolling, newspaper-games style. Header bar; a compact chain
   strip (start, five slots, target) with the latest link under it; six type keys; a tile
   grid that flexes to fill the height left; mistakes and pill buttons.
   Flat fills, no colour coding: state is shown by fill (empty / filled / spent). */
:root {
  --bg: #ffffff;
  --ink: #121212;
  --ink-2: #5a5a5a;
  --muted: #787c7e;
  --rule: #d3d6da;
  --tile: #efefe6;          /* unplayed tile */
  --tile-ink: #121212;
  --dark: #5a594e;          /* filled / spent */
  --dark-ink: #ffffff;
  --end: #121212;           /* start and target rows */
  --end-ink: #ffffff;
  --key: #d3d6da;
  --toast: #121212;
  --toast-ink: #ffffff;
  --scrim: rgba(255, 255, 255, .6);
  --sheet: #ffffff;
  --shadow: 0 4px 23px rgba(0, 0, 0, .2);
  --focus: #121212;
  --display: "Zilla Slab", Rockwell, "Courier New", Georgia, serif;
  --sans: "Libre Franklin", "Franklin Gothic Medium", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121213; --ink: #f8f8f8; --ink-2: #b9b9b9; --muted: #818384; --rule: #3a3a3c;
  --tile: #3a3a3c; --tile-ink: #f8f8f8; --dark: #818384; --dark-ink: #121213;
  --end: #f8f8f8; --end-ink: #121213; --key: #565758;
  --toast: #f8f8f8; --toast-ink: #121213; --scrim: rgba(0, 0, 0, .55); --sheet: #1e1e1f;
  --shadow: 0 4px 23px rgba(0, 0, 0, .6); --focus: #f8f8f8;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121213; --ink: #f8f8f8; --ink-2: #b9b9b9; --muted: #818384; --rule: #3a3a3c;
  --tile: #3a3a3c; --tile-ink: #f8f8f8; --dark: #818384; --dark-ink: #121213;
  --end: #f8f8f8; --end-ink: #121213; --key: #565758;
  --toast: #f8f8f8; --toast-ink: #121213; --scrim: rgba(0, 0, 0, .55); --sheet: #1e1e1f;
  --shadow: 0 4px 23px rgba(0, 0, 0, .6); --focus: #f8f8f8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); height: 100%; }
body { color: var(--ink); font-family: var(--sans); font-size: 16px; margin: 0; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* Header bar */
.bar { border-bottom: 1px solid var(--rule); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
.bar-in { max-width: 640px; margin: 0 auto; height: 50px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.bar h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 27px; letter-spacing: .01em; line-height: 1; text-align: center; }
.bar .left, .bar .right { display: flex; align-items: center; gap: 4px; }
.bar .right { justify-content: flex-end; }
.icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; }
.icon:hover:not(:disabled) { background: var(--tile); }
.icon:disabled { opacity: .3; cursor: default; }
.icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

main { flex: 1; min-height: 0; width: 100%; max-width: 560px; margin: 0 auto; padding-block: 12px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 12px; }

.pick { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 0;
  padding: 2px 0; cursor: pointer; text-align: right; max-width: 92px; }
.prompt { text-align: center; font-size: 15px; margin: 0; }
.prompt b { font-weight: 700; }

/* Chain strip: start, five slots, target */
.chain { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 3px; }
.cell { height: 32px; min-width: 40px; padding: 0 9px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
.cell.end { background: var(--end); color: var(--end-ink); }
.cell.word { background: var(--tile); color: var(--tile-ink); cursor: pointer; }
.cell.word:hover { box-shadow: inset 0 0 0 2px var(--dark); }
.cell.empty { border: 2px solid var(--rule); }
.cell.next { border-color: var(--muted); }
.cell.live { cursor: pointer; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--muted); }
.sep { color: var(--muted); font-size: 13px; line-height: 1; }
.last { min-height: 18px; text-align: center; font-size: 13px; color: var(--ink-2); line-height: 1.35; margin: -4px 0 0; }
.last b { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; color: var(--ink); margin-right: 6px; }

/* Type keys */
.keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.key { height: 40px; border-radius: 4px; background: var(--key); color: var(--ink); font-weight: 700; font-size: 12px;
  text-transform: uppercase; letter-spacing: .02em; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 6px; text-align: center; line-height: 1.15; min-width: 0; }
.key small { font-size: 10px; font-weight: 600; text-transform: none; letter-spacing: 0; opacity: .85; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key.spent { background: var(--dark); color: var(--dark-ink); }
.key.hint { box-shadow: inset 0 0 0 3px var(--ink); }

/* Tiles */
/* 3 across on phones (the tenth tile centred), 5 across when there's room. Rows are
   64px, shrinking toward 40px when the screen is short. */
.tiles { flex: 0 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-rows: minmax(40px, 64px); gap: 8px; }
@media (max-height: 700px) { .tiles { grid-auto-rows: minmax(40px, 52px); } }
@media (max-height: 620px) { .tiles { grid-auto-rows: 42px; } }
.tile { grid-column: span 2; }
.tile:last-child:nth-child(3n + 1) { grid-column: 3 / span 2; }
@media (min-width: 560px) {
  .tiles { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tile, .tile:last-child:nth-child(3n + 1) { grid-column: auto; }
}
.tile { height: 100%; border-radius: 6px; background: var(--tile); color: var(--tile-ink); font-weight: 700; font-size: 15px;
  text-transform: uppercase; letter-spacing: .02em; padding: 0 6px; overflow-wrap: anywhere; transition: transform .1s; }
.tile:active:not(:disabled) { transform: scale(.96); }
.tile:disabled { visibility: hidden; }
@media (max-width: 380px) { .tile { font-size: 13px; } }
.tile.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { .tile.shake { animation: none; } .tile { transition: none; } }

.mistakes { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); }
.mistakes i { width: 14px; height: 14px; border-radius: 50%; background: var(--dark); display: inline-block; }
.mistakes i.gone { visibility: hidden; }

.pills { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.pill { height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--ink); font-weight: 600; font-size: 15px; background: var(--bg); }
.pill:disabled { opacity: .35; cursor: default; }
.pill.solid { background: var(--ink); color: var(--bg); }

.notes textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--rule); border-radius: 4px; background: var(--bg);
  color: var(--ink); font: inherit; font-size: 15px; padding: 10px 12px; line-height: 1.4; margin-top: 10px; }
.notes .row2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; }
.notes .row2 .pill { height: 36px; padding: 0 16px; font-size: 14px; }

/* Toast */
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 72px); left: 0; right: 0; display: flex; flex-direction: column;
  align-items: center; gap: 8px; pointer-events: none; z-index: 30; padding: 0 16px; }
.toast { background: var(--toast); color: var(--toast-ink); font-weight: 700; font-size: 14px; padding: 13px 16px; border-radius: 4px;
  max-width: 420px; text-align: center; line-height: 1.35; transition: opacity .3s; }
.toast.out { opacity: 0; }

/* Modals */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--sheet); color: var(--ink); width: min(520px, 100%); max-height: 100%; overflow: auto; border-radius: 8px;
  box-shadow: var(--shadow); padding: 18px 22px 26px; position: relative; }
.sheet .x { position: absolute; top: 10px; right: 10px; }
.sheet h2 { font-family: var(--display); font-weight: 700; font-size: 30px; margin: 18px 0 6px; text-wrap: balance; }
.sheet h3 { font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
.sheet p, .sheet li { font-size: 15px; line-height: 1.45; }
.sheet ul { padding-left: 20px; margin: 8px 0; }
.sheet .sub { color: var(--ink-2); margin: 0 0 6px; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.choice { text-align: left; border-radius: 6px; background: var(--tile); padding: 12px 14px; line-height: 1.35; }
.choice:hover { box-shadow: inset 0 0 0 2px var(--dark); }
.choice b { display: block; text-transform: uppercase; font-size: 13px; letter-spacing: .04em; margin-bottom: 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; font-size: 14px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid var(--rule); }
.steps li b { text-transform: uppercase; font-size: 11px; letter-spacing: .06em; padding-top: 2px; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; margin-top: 14px; font-variant-numeric: tabular-nums; }
.sheet .pills { margin-top: 22px; }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="left">
      <button class="icon" id="help" aria-label="How to play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
      <button class="icon" id="notes" aria-label="Notes on this board"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    </div>
    <h1>Degrees</h1>
    <div class="right">
      <button class="icon" id="prev" aria-label="Previous board"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <select class="pick" id="pick" aria-label="Choose a board"></select>
      <button class="icon" id="next" aria-label="Next board"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
</header>

<main>
  <p class="prompt" id="prompt"></p>
  <ol class="chain" id="chain" aria-label="Your chain"></ol>
  <p class="last" id="last"></p>
  <div class="keys" id="keys" aria-label="Link types, each spent once"></div>

  <div class="tiles" id="tiles"></div>

  <div class="mistakes" id="mistakes"></div>

  <div class="pills">
    <button class="pill" id="back">Back</button>
    <button class="pill" id="hint">Hint</button>
    <button class="pill" id="reveal">Give up</button>
  </div>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal"></div>

<script>
const DATA = __DATA__;
const { chain: CHAIN, types: TYPES, typeNames: NAMES, boards: BOARDS } = DATA;
const STRIKES = 3;
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const key = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const X_ICON = '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>';

const KEY = `degrees6.${DATA.set || "proto"}.`;
let results = store.get(KEY + "results", {});
let notes = store.get(KEY + "notes", {});
let bi = 0, B, S;

function fits(x, y) { return B.edges[key(x, y)] || {}; }

function load(i) {
  bi = Math.max(0, Math.min(BOARDS.length - 1, i));
  B = BOARDS[bi];
  S = { path: [B.start], used: [], strikes: 0, backs: 0, hints: 0, hinted: null, over: false, won: false };
  store.set(KEY + "last", bi);
  closeModal();
  render();
}

// First moves of full solves from the current word: [tile, type].
function nextSteps() {
  const need = CHAIN - (S.path.length - 1);
  const used = new Set(S.used), onPath = new Set(S.path);
  const pool = B.tiles.filter((w) => !onPath.has(w));
  const finishes = (here, left, taken, seen) => {
    if (left === 1) return Object.keys(fits(here, B.target)).some((t) => !taken.has(t));
    for (const w of pool) {
      if (seen.has(w)) continue;
      for (const t of Object.keys(fits(here, w))) {
        if (taken.has(t)) continue;
        seen.add(w); taken.add(t);
        const ok = finishes(w, left - 1, taken, seen);
        seen.delete(w); taken.delete(t);
        if (ok) return true;
      }
    }
    return false;
  };
  const here = S.path[S.path.length - 1], out = [];
  for (const w of need === 1 ? [B.target] : pool) {
    for (const t of Object.keys(fits(here, w))) {
      if (used.has(t)) continue;
      used.add(t);
      if (need === 1 || finishes(w, need - 1, used, new Set([w]))) out.push([w, t]);
      used.delete(t);
    }
  }
  return out;
}

function toast(text, ms = 2400) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  $("toasts").replaceChildren(el);
  setTimeout(() => el.classList.add("out"), ms);
  setTimeout(() => el.remove(), ms + 350);
}

function play(word) {
  if (S.over) return;
  const here = S.path[S.path.length - 1];
  const all = Object.keys(fits(here, word)), free = all.filter((t) => !S.used.includes(t));
  if (!all.length || !free.length) {
    S.strikes++;
    toast(all.length ? `Already spent: ${all.map((t) => NAMES[t]).join(" / ")}` : `${cap(word)} doesn't link to ${here}`);
    shake(word);
    if (S.strikes >= STRIKES) { finish(false); }
    render();
    return;
  }
  if (free.length > 1) return chooseType(here, word, free);
  commit(word, free[0]);
}

function commit(word, t) {
  S.path.push(word); S.used.push(t); S.hinted = null;
  closeModal();
  if (word === B.target) finish(true);
  render();
}

function backTo(n) {   // keep the first n+1 words
  if (S.over || S.path.length <= n + 1) return;
  while (S.path.length > n + 1) { S.path.pop(); S.used.pop(); S.backs++; }
  S.hinted = null;
  render();
}

function hint() {
  if (S.over) return;
  S.hints++;
  const steps = nextSteps();
  if (steps.length) { S.hinted = steps[0][1]; toast(`Spend ${NAMES[S.hinted]} next`); }
  else { S.hinted = null; toast(`No way through from ${S.path[S.path.length - 1]}. Go back.`); }
  render();
}

function finish(won) {
  S.over = true; S.won = won;
  const prev = results[bi];
  if (!prev || (won && !prev.won)) results[bi] = { won, clean: won && !S.strikes && !S.backs && !S.hints };
  store.set(KEY + "results", results);
  setTimeout(showResult, won ? 500 : 900);
}

function shake(word) {
  requestAnimationFrame(() => {
    const el = [...document.querySelectorAll(".tile")].find((b) => b.dataset.w === word);
    if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
  });
}

// ---- rendering ---------------------------------------------------------------

function render() {
  $("pick").innerHTML = BOARDS.map((b, i) => {
    const r = results[i];
    const mark = r ? (r.won ? (r.clean ? " ★" : " ✓") : " ✗") : "";
    return `<option value="${i}"${i === bi ? " selected" : ""}>${i + 1} / ${BOARDS.length}${mark}</option>`;
  }).join("");
  $("prev").disabled = bi === 0; $("next").disabled = bi === BOARDS.length - 1;
  $("prompt").innerHTML = `Connect <b>${esc(B.start.toUpperCase())}</b> to <b>${esc(B.target.toUpperCase())}</b> in ${CHAIN} links`;

  // chain strip
  const cells = [];
  for (let i = 0; i <= CHAIN; i++) {
    const isEnd = i === 0 || i === CHAIN;
    let cls = "cell", inner = "", attrs = "";
    if (isEnd) {
      cls += " end"; inner = esc(i === 0 ? B.start : B.target);
      if (i === CHAIN && !S.over && S.path.length === CHAIN) {
        cls += " live"; attrs = ` data-play="${esc(B.target)}" role="button" tabindex="0" aria-label="Play ${esc(B.target)}"`;
      }
    } else if (i < S.path.length) {
      cls += " word"; inner = esc(S.path[i]);
      if (!S.over) attrs = ` data-back="${i}" role="button" tabindex="0" title="${i === S.path.length - 1 ? "Take back" : "Go back to here"}"`;
    } else {
      cls += " empty" + (i === S.path.length && !S.over ? " next" : "");
      attrs = ' aria-label="empty"';
    }
    cells.push(`<li class="${cls}"${attrs}>${inner}</li>`);
    if (i < CHAIN) cells.push('<li class="sep" aria-hidden="true">›</li>');
  }
  $("chain").innerHTML = cells.join("");
  const n = S.used.length;
  $("last").innerHTML = n
    ? `<b>${esc(NAMES[S.used[n - 1]])}</b>${esc(B.edges[key(S.path[n - 1], S.path[n])][S.used[n - 1]])}`
    : "Tap a tile that links to the last word in your chain.";

  // keys: each spent key shows the pair that spent it
  $("keys").innerHTML = TYPES.map((t) => {
    const k = S.used.indexOf(t);
    const pair = k >= 0 ? `<small>${esc(S.path[k])} – ${esc(S.path[k + 1])}</small>` : "";
    return `<div class="key${k >= 0 ? " spent" : ""}${S.hinted === t ? " hint" : ""}" aria-label="${esc(NAMES[t])}${k >= 0 ? ", spent" : ""}">${esc(NAMES[t])}${pair}</div>`;
  }).join("");

  // tiles
  $("tiles").innerHTML = B.tiles.map((w) =>
    `<button class="tile" data-w="${esc(w)}"${S.path.includes(w) || S.over ? " disabled" : ""}>${esc(w)}</button>`).join("");

  // mistakes + buttons
  $("mistakes").innerHTML = "Mistakes remaining: " +
    Array.from({ length: STRIKES }, (_, i) => `<i class="${i < STRIKES - S.strikes ? "" : "gone"}"></i>`).join("");
  $("back").disabled = S.over || S.path.length < 2;
  $("hint").disabled = S.over;
  $("reveal").textContent = S.over ? "See results" : "Give up";
}

function noteCount() {
  const n = Object.values(notes).filter((v) => v && v.trim()).length;
  return n ? `${n} board${n > 1 ? "s" : ""} with notes, saved in this browser` : "Notes are saved in this browser";
}

function showNotes() {
  openModal(`<h2>Notes</h2><p class="sub">Board ${bi + 1}: ${esc(B.start)} → ${esc(B.target)}</p>
    <div class="notes">
      <textarea id="note" placeholder="Links that felt wrong, links you expected, whether the type choice mattered…">${esc(notes[bi] || "")}</textarea>
      <div class="row2"><span id="noteCount">${noteCount()}</span><button class="pill" id="copy">Copy all notes</button></div>
      <textarea id="copyOut" readonly hidden aria-label="All notes"></textarea>
    </div>`, "Notes");
  const t = $("note");
  t.focus();
  t.oninput = () => { notes[bi] = t.value; store.set(KEY + "notes", notes); $("noteCount").textContent = noteCount(); };
  $("copy").onclick = copyNotes;
}

async function copyNotes() {
  const lines = BOARDS.map((b, i) => notes[i] && notes[i].trim() ? `Board ${i + 1} (${b.start} → ${b.target}): ${notes[i].trim()}` : null).filter(Boolean);
  if (!lines.length) { $("noteCount").textContent = "No notes yet"; return; }
  const text = `${DATA.setName || "Degrees"} playtest notes (seed ${DATA.seed})\n` + lines.join("\n");
  try { await navigator.clipboard.writeText(text); $("noteCount").textContent = `Copied notes for ${lines.length} board${lines.length > 1 ? "s" : ""}`; }
  catch { const t = $("copyOut"); t.hidden = false; t.value = text; t.select(); $("noteCount").textContent = "Couldn't copy automatically. The notes are selected below."; }
}

// ---- modals --------------------------------------------------------------------

function openModal(html, label) {
  $("modal").innerHTML = `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">
    <button class="icon x" data-close aria-label="Close">${X_ICON}</button>${html}</div></div>`;
  const focus = $("modal").querySelector(".choice, .pill, [data-close]");
  if (focus) focus.focus();
}
function closeModal() { $("modal").innerHTML = ""; }

function chooseType(here, word, free) {
  openModal(`<h2>${esc(cap(here))} → ${esc(word)}</h2>
    <p class="sub">This link fits more than one type. Which will you spend?</p>
    <div class="choices">${free.map((t) =>
      `<button class="choice" data-spend="${t}" data-word="${esc(word)}"><b>${esc(NAMES[t])}</b>${esc(B.edges[key(here, word)][t])}</button>`).join("")}</div>`,
    "Choose a link type");
}

function stepsHtml(path, types) {
  return `<ol class="steps">${types.map((t, i) =>
    `<li><b>${esc(NAMES[t])}</b><span>${esc(B.edges[key(path[i], path[i + 1])][t])}</span></li>`).join("")}</ol>`;
}

function showResult() {
  if (!S.over) return;
  const clean = !S.strikes && !S.backs && !S.hints;
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const head = S.won ? (clean ? "Clean solve" : "Connected") : "Next time";
  const sub = S.won
    ? (clean ? "No mistakes, backs or hints." : `${plural(S.strikes, "mistake")}, ${plural(S.backs, "back")}, ${plural(S.hints, "hint")}.`)
    : `You made ${S.path.length - 1} of ${CHAIN} links.`;
  const mine = S.path.join(" ");
  const sols = B.solutions.map((s, i) =>
    `<h3>${B.solutions.length > 1 ? `Solution ${i + 1}` : "The solution"}${s.path.join(" ") === mine ? " (yours)" : ""}</h3>${stepsHtml(s.path, s.types)}`).join("");
  const yours = S.won && !B.solutions.some((s) => s.path.join(" ") === mine) ? `<h3>Your chain</h3>${stepsHtml(S.path, S.used)}` : "";
  openModal(`<h2>${head}</h2><p class="sub">${sub}</p>${yours}${sols}
    <div class="facts"><span>${plural(B.solutions.length, "solution")}</span><span>${plural(B.traps, "trap")}</span><span>random win ${(B.randomWin * 100).toFixed(0)}%</span></div>
    <div class="pills"><button class="pill" data-again>Play again</button>${bi < BOARDS.length - 1 ? '<button class="pill solid" data-nextboard>Next board</button>' : ""}</div>`,
    "Result");
}

function showHelp() {
  openModal(`<h2>How to play</h2>
    <p class="sub">Connect the top word to the bottom word in ${CHAIN} links: five words in between.</p>
    <ul>
      <li>Tap a tile that links to the last word in your chain.</li>
      <li>Every link is one of six types, and each type can be spent only once: ${TYPES.map((t) => esc(NAMES[t])).join(", ")}.</li>
      <li>If a link fits two unspent types, you choose which to spend.</li>
      <li>A tile that doesn't link, or a link whose type is spent, is a mistake. ${STRIKES} mistakes and the board is over.</li>
      <li>Tap a word in your chain, or Back, to undo. Its type comes back.</li>
      <li>Hint names the type to spend next.</li>
    </ul>`, "How to play");
}

// ---- events --------------------------------------------------------------------

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-w],[data-play],[data-back],[data-spend],[data-close],[data-again],[data-nextboard],[data-scrim]");
  if (!el) return;
  if (el.dataset.scrim !== undefined && e.target !== el) return;   // clicks inside the sheet
  if (el.dataset.w) play(el.dataset.w);
  else if (el.dataset.play) play(el.dataset.play);
  else if (el.dataset.back != null) { const i = +el.dataset.back; backTo(i === S.path.length - 1 ? i - 1 : i); }
  else if (el.dataset.spend) commit(el.dataset.word, el.dataset.spend);
  else if (el.dataset.again !== undefined) load(bi);
  else if (el.dataset.nextboard !== undefined) load(bi + 1);
  else closeModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-play],[data-back]")) { e.preventDefault(); e.target.click(); }
});
$("back").onclick = () => backTo(S.path.length - 2);
$("hint").onclick = hint;
$("reveal").onclick = () => { if (S.over) showResult(); else { finish(false); render(); } };
$("help").onclick = showHelp;
$("prev").onclick = () => load(bi - 1);
$("next").onclick = () => load(bi + 1);
$("pick").onchange = (e) => load(+e.target.value);
$("notes").onclick = showNotes;

load(store.get(KEY + "last", 0));
</script>
