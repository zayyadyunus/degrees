# Fly.io config. Deploy with: fly deploy --ha=false
#
# Exactly ONE always-on machine: games live in process memory, so a second
# machine would 404 other machines' games, and stopping on idle wipes them.

app = "degrees-game"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Fly's proxy sets this to the real client IP; clients can't spoof it.
  DEGREES_CLIENT_IP_HEADER = "Fly-Client-IP"
  # Daily puzzle #1. Must match the first date in backend/data/dailies.json.
  DEGREES_DAILY_EPOCH = "2026-11-28"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
